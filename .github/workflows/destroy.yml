name: Destroy
run-name: Destroy conditions test
on:
  pull_request:
    types:
      - closed
      - edited
      - unlabeled

jobs:
  destroy-job:
    runs-on: ubuntu-latest
    if: |
      github.event.action == 'closed' ||
      github.event.action == 'unlabeled' && github.event.label.name == 'deploy' ||
      github.event.action == 'edited' && ! endsWith(github.event.pull_request.title, '[deploy]')
    steps:
      - run: echo "Start"
      - name: GH context
        env:
          GH: ${{ toJson(github)}}
        run: |
          echo -e "Github context:\n$GH"
  report-comment:
    runs-on: ubuntu-latest
    needs:
      - destroy-job
    if: needs.destroy-job.result != 'skipped'
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '👋 CI result: ${{ needs.destroy-job.result }}.'
            })
