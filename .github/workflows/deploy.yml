name: Deploy
run-name: Deploy conditions test
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - edited

jobs:
  deploy-job:
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.state == 'open' && (
        contains(github.event.pull_request.labels.*.name, 'deploy') ||
        endsWith(github.event.pull_request.title, '[deploy]')
      ) && (
        contains(fromJSON('["opened", "reopened", "synchronize"]'), github.event.action) ||
        github.event.action == 'labeled' && github.event.label.name == 'deploy' ||
        github.event.action == 'edited' && endsWith(github.event.pull_request.title, '[deploy]')
      )
    steps:
      - run: echo "Start"
      - name: GH context
        env:
          GH: ${{ toJson(github)}} ${{ github.event.pull_request.state }}
        run: |
          echo -e "Github context:\n$GH"
      # - name: Fail step
      #   id: fail-step
      #   run: |
      #     asdfasdfasdf
      - uses: actions/github-script@v7
        name: comment after failure
        if: always()
        with:
          script: |
            const status = "${{ job.status }}";
            let body = `Deployment result: ${status}`;
            if (status == "success") {
              body += "\nSome variable: ${{ github.event.pull_request.url }}--${{ github.event.pull_request.head }}"
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            })
